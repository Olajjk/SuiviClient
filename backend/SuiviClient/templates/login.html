{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block content %}
<div class="card">
    <h1 class="card-title">Bon retour </h1>
    <p class="card-subtitle">Connectez-vous à votre compte</p>

    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}

    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="vous@exemple.com" required autofocus>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="" required>
        </div>

        <button type="submit" class="btn">Se connecter</button>
    </form>

    <p class="form-footer">
        Pas encore de compte ? <a href="{% url 'register' %}">S'inscrire</a>
    </p>
</div>
{% endblock %}
